# Test configuration: runs the full pipeline on the small test data in
# tests/data/ (4 samples, chr22 reference, babykraken). Used by
# tests/run_local_test.sh via the tests/profile profile.

# Output directory: all results are written here. Relative paths are resolved
# from the directory snakemake is launched in; absolute paths also work.
# Can be overridden at runtime with: --config outdir=/path/to/out
outdir: "tests/results"

#Sample metadata
samples: tests/config/metadata.tsv
units: tests/config/units.tsv

# Steps

run_alignment: true
run_kraken: true
run_bracken: false # bracken is not set up for babykraken
run_multiqc: true

# Alignment Details
aligner:
  reference_dir: "tests/data/ref_genome/" # Reference DIR should contain the genome fq and gtf files. 
  reference_fq: "Homo_sapiens.GRCh38.dna.chromosome.22.fa"
  db_prefix: "chr22_star"
  star_index_extra: "--genomeSAindexNbases 11" # required by STAR for a small (~50 Mb) genome
  annotation_gtf: "Homo_sapiens.GRCh38.115.chr22.gtf.gz"

unmapped_reads:
  keep_unmapped: false
  align_unmapped: false
  unmapped_refs: 
      reference_fq: "custom/custom.fq"
      annotation_gtf: "custom/custom.gtf"

params:
  cutadapt-pe: "-a AGATCGGAAGAGCACACGTCTGAACTCCAGTCA -A AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT --nextseq-trim=20 --minimum-length 33 --overlap 7"
  cutadapt-se: "-a AGATCGGAAGAGCACACGTCTGAACTCCAGTCA --nextseq-trim=20 --minimum-length 33 --overlap 7"
  # reasoning behind parameters:
  #   * `-a`/`-A`: Illumina TruSeq-style 3' adapters (also used by NEBNext Ultra II) for R1/R2.
  #     No 5' adapters (-g/-G): adapter read-through only occurs at the 3' end.
  #   * `--nextseq-trim=20`: quality-trims 3' ends while treating high-quality G calls as low quality.
  #     Needed for 2-colour chemistry (NextSeq, NovaSeq 6000/X), where no signal is called as G
  #     and produces poly-G tails.
  #   * `--minimum-length 33`: drop read pairs where either read is shorter than 33 bp after trimming.
  #   * `--overlap 7`: require at least 7 bp of adapter before trimming; the cutadapt default (3)
  #     trims short random matches at read ends.
  #   * error rate: cutadapt default (`-e 0.1`), which tolerates sequencing errors in the adapter.
  kraken:
    read_length: 150 # also sets the STAR sjdbOverhang (read_length - 1)
    confidence: 0.1 # kraken2 --confidence; higher = fewer, more reliable classifications

refs:
  rRNA_ref_dbs: 
    - silva-arc-16s-id95
    - silva-euk-18s-id95
    - silva-bac-23s-id98
    - silva-bac-16s-id90
    - silva-euk-28s-id98
    - rfam-5s-database-id98
    - rfam-5.8s-database-id98
  kraken_db_dir:
    - tests/data/babykraken
  human_genome_cDNA:
    - Homo_sapiens.GRCh38.cdna.all.fa.gz

plots:
  bracken:
    abund_cutoff: 0.05

#===============================
#Quantitative Model Evaluation
#===============================

genomes:
  P_aeruginosa:
    ref_fq: "P_aeruginosa/Pseudomonas_aeruginosa_PAO1_107.fna.gz"
    annotation: "P_aeruginosa/Pseudomonas_aeruginosa_PAO1_107.gtf"
  Homo_sapiens:
    ref_fq: "Homo_sapiens.GRCh38.dna.primary_assembly.fa.gz"
    annotation: "Homo_sapiens.GRCh38.106.gtf"

  target_organism: "P_aeruginosa" # Should match folder names in reference/reference_genomes
  filter1: "Homo_sapiens" #Filter reads from this genome (for example for Dual-RNA seq)

