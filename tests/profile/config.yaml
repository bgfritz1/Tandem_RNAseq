# Snakemake v9 profile for the local installation test (no cluster).
# Usage: snakemake --profile tests/profile
cores: 16
software-deployment-method: conda
printshellcmds: true
configfile: tests/config/config.yaml

# feature_counts hardcodes tmpdir="/scratch" (Computerome); use /tmp locally
set-resources:
  - feature_counts:tmpdir="/tmp"
